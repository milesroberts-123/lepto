# --- KMC ---
kmc_k: 31
kmc_mincount: 10
kmc_maxcount: auto

# --- fastp ---
fastp_unqual_limit: 40
fastp_qual_thresh: 20
fastp_window_length: 4
fastp_min_len: 31
fastp_n_base_limit: 5

# --- kmc_filter: how to build group-specific k-mer set ---
subtract_groups: true
min_group_count: 0

# --- metaSPAdes ---
metaspades_kmers: "auto"
metaspades_mem: 200
metaspades_tmp_dir: "/tmp"

# --- kmc_tools complex params ---
kmc_intersect_depth: 1000000

# --- BWA ---
bwa_refs:
  hap1: "../resources/reference/hap1.fasta"
  hap2: "../resources/reference/hap2.fasta"
bwa_count_threshold: 40
bwa_k: 31
bwa_A: 1
bwa_B: 100
bwa_O: 100
bwa_E: 100
bwa_L: 100
bwa_T: 31
bwa_merge_distance: 1000

# --- minimap2 ---
minimap2_f: 0.02

# --- PANTHER HMM search ---
panther_input_fastas:
  hap1: "../resources/annotation/LPJR3B1_scaf_hap1_braker_aa.fasta"
  hap2: "../resources/annotation/LPJR3B1_scaf_hap2_braker_aa.fasta"
panther_batches: 3000
panther_hmmsearch_cpu: 8
panther_hmmsearch_evalue: 0.001
panther_hmmsearch_dome: 1e-8
panther_hmmsearch_ince: 0.001
panther_hmmsearch_incdome: 1e-8

# --- OrthoFinder ---
orthofinder_external_proteomes:
  arabidopsis: "../resources/proteomes/arabidopsis_thaliana.faa"

# --- featureCounts ---
featurecounts_annotations:
  hap1: "../resources/annotation/hap1.gff3"
  hap2: "../resources/annotation/hap2.gff3"
featurecounts_bams:
  hap1:
    - "../resources/annotation/rna_hap1/LP1_MAPQFiltered_CoordSort.bam"
    - "../resources/annotation/rna_hap1/LP2_MAPQFiltered_CoordSort.bam"
    - "../resources/annotation/rna_hap1/LP3_MAPQFiltered_CoordSort.bam"
    - "../resources/annotation/rna_hap1/LP4_MAPQFiltered_CoordSort.bam"
    - "../resources/annotation/rna_hap1/LP5_MAPQFiltered_CoordSort.bam"
    - "../resources/annotation/rna_hap1/LP6_MAPQFiltered_CoordSort.bam"
  hap2:
    - "../resources/annotation/rna_hap2/LP1_MAPQFiltered_CoordSort.bam"
    - "../resources/annotation/rna_hap2/LP2_MAPQFiltered_CoordSort.bam"
    - "../resources/annotation/rna_hap2/LP3_MAPQFiltered_CoordSort.bam"
    - "../resources/annotation/rna_hap2/LP4_MAPQFiltered_CoordSort.bam"
    - "../resources/annotation/rna_hap2/LP5_MAPQFiltered_CoordSort.bam"
    - "../resources/annotation/rna_hap2/LP6_MAPQFiltered_CoordSort.bam"
featurecounts_gff_feature: "Parent"
featurecounts_paired: true

# --- vg graph genome & diversity ---
vg_ref_backbone: "hap2"
vg_ref_variant: "hap1"
vg_surject_prefixes:
  - "hap2_scaffold_1"
grenedalf_window_width: 50000
grenedalf_pool_sizes: 100
grenedalf_filter_min_count: 2
grenedalf_filter_min_read_depth: 1
grenedalf_window_average_policy: "valid-loci"
grenedalf_filter_sample_min_count: 2
grenedalf_min_map_qual: 20
grenedalf_min_base_qual: 20

# --- samples ---
samples_table: "../config/samples.tsv"
