# --- KMC ---
kmc_k: 31
kmc_mincount: 10
kmc_maxcount: auto

# --- fastp ---
fastp_unqual_limit: 40
fastp_qual_thresh: 20
fastp_window_length: 4
fastp_min_len: 31
fastp_n_base_limit: 5

# --- kmc_tools complex params ---
kmc_intersect_depth: 1000000

# --- BWA ---
bwa_refs:
  hap1: "../resources/reference/hap1.fasta"
  hap2: "../resources/reference/hap2.fasta"
  hap1_rc: "../resources/reference/hap1_rc.fasta"
  hap2_rc: "../resources/reference/hap2_rc.fasta"
bwa_count_threshold: 40
bwa_k: 31
bwa_A: 1
bwa_B: 100
bwa_O: 100
bwa_E: 100
bwa_L: 100
bwa_T: 31
bwa_merge_distance: 1000

# --- minimap2 ---
minimap2_f: 0.02

# --- PANTHER HMM search ---
panther_input_fastas:
  hap1: "../resources/annotation/LPJR3B1_scaf_hap1_braker_aa.fasta"
  hap2: "../resources/annotation/LPJR3B1_scaf_hap2_braker_aa.fasta"
panther_batches: 3000
panther_hmmsearch_evalue: 0.001
panther_hmmsearch_dome: 1e-8
panther_hmmsearch_ince: 0.001
panther_hmmsearch_incdome: 1e-8

# --- OrthoFinder ---
orthofinder_external_proteomes:
  arabidopsis: "../resources/proteomes/arabidopsis_thaliana.faa"
  linanthus: "results/braker/linanthus/braker_expressed.faa"
  #phlox: "../resources/proteomes/phlox_drummondii/phlox_drummondii.faa"

# --- featureCounts ---
featurecounts_annotations:
  hap1: "../resources/annotation/hap1.gff3"
  hap2: "../resources/annotation/hap2.gff3"
featurecounts_bams:
  hap1:
    - "../resources/annotation/rna_hap1/LP1_MAPQFiltered_CoordSort.bam"
    - "../resources/annotation/rna_hap1/LP2_MAPQFiltered_CoordSort.bam"
    - "../resources/annotation/rna_hap1/LP3_MAPQFiltered_CoordSort.bam"
    - "../resources/annotation/rna_hap1/LP4_MAPQFiltered_CoordSort.bam"
    - "../resources/annotation/rna_hap1/LP5_MAPQFiltered_CoordSort.bam"
    - "../resources/annotation/rna_hap1/LP6_MAPQFiltered_CoordSort.bam"
  hap2:
    - "../resources/annotation/rna_hap2/LP1_MAPQFiltered_CoordSort.bam"
    - "../resources/annotation/rna_hap2/LP2_MAPQFiltered_CoordSort.bam"
    - "../resources/annotation/rna_hap2/LP3_MAPQFiltered_CoordSort.bam"
    - "../resources/annotation/rna_hap2/LP4_MAPQFiltered_CoordSort.bam"
    - "../resources/annotation/rna_hap2/LP5_MAPQFiltered_CoordSort.bam"
    - "../resources/annotation/rna_hap2/LP6_MAPQFiltered_CoordSort.bam"
featurecounts_gff_feature: "Parent"
featurecounts_paired: true

# --- MCScanX hap1/hap2 collinearity ---
# Inputs are the featureCounts-expressed products (matching gene sets);
# paths point at the featurecounts subworkflow outputs.
mcscanx_input_fastas:
  hap1: "results/featurecounts/hap1_expressed.faa"
  hap2: "results/featurecounts/hap2_expressed.faa"
  linanthus: "results/braker/linanthus/braker_expressed.faa"
mcscanx_input_gffs:
  hap1: "results/featurecounts/hap1_expressed.gff3"
  hap2: "results/featurecounts/hap2_expressed.gff3"
  linanthus: "results/braker/linanthus/braker_expressed.gff3"
mcscanx_blast_evalue: 1e-5
mcscanx_blast_max_targets: 15

# --- vg graph genome & diversity ---
vg_ref_backbone: "hap1"
vg_ref_variant: "hap2"
paftools_call_L: 1000
paftools_call_q: 20
samtools_mpileup_Q: 20
samtools_mpileup_q: 20
#grenedalf_window_width: 50000
#grenedalf_window_interval_stride: 5000
grenedalf_window_width: 500000
grenedalf_window_interval_stride: 0
grenedalf_filter_sample_min_read_depth: 5
grenedalf_window_average_policy: "valid-loci"
grenedalf_filter_sample_min_count: 2
grenedalf_filter_total_snp_min_count: 2
grenedalf_min_map_qual: 20
grenedalf_min_base_qual: 20
grenedalf_subsample_max_read_depth: 500
grenedalf_fst_method: "unbiased-hudson"

# --- sequence tube map ---
# Static tube-map-style subworkflow (workflow/rules/tubemap.smk): renders
# vg viz SVGs of regions of the minimap2 hap2-vs-hap1 alignment as a graph
# built with vg construct -a -R (backbone fasta reference path + paf-derived
# VCF alt paths). Regions are "chrom:start-end" strings; the chunk wildcard
# sanitizes them to chrom_start_end. Regions must be kb-scale (vg viz draws
# 1 bp per layout unit); padding gives the graph breathing room around the
# region of interest, and coordinates inside each graph restart at the
# region start.
tubemap_variant: "hap2"
tubemap_backbone: "hap1"
tubemap_regions: ["hap1_scaffold_25:6000-7000"]
tubemap_region_pad: 100

# --- grenedalf pooled diversity ---
# Pool samples together into one merged sample (grenedalf
# --sample-group-merge-table): per-position base counts are summed
# over the listed sample IDs, so pi reflects the combined population,
# with the pool size recomputed as the sum of the member pools.
# The merged sample (output dir, filename and CSV columns) is named
# by grenedalf_pooled_diversity_name. An empty ID list disables the
# pooled-diversity branch. Grenedalf names SAM inputs by file basename,
# which here is the sample ID.
grenedalf_pooled_diversity_name: "pooled"
grenedalf_pooled_diversity_ids: [1, 3, 5, 7]
grenedalf_pooled_multi_file_locus_set: "union"

# --- sourmash ---
sourmash_fastas:
        #hap1: "../resources/reference/hap1.fasta"
        #hap2: "../resources/reference/hap2.fasta"
  hap1: "../resources/reference/mimulus_guttatus/Mguttatusvar_IM62_948_v4.1.fa"
  hap2: "../resources/reference/mimulus_guttatus/Mguttatusvar_IM767_887_v2.0.fa"
sourmash_sketch_modes:
  hap1: "standard"
  hap2: "multiplicity"
sourmash_k: 31
sourmash_scaled: 10000
sourmash_s: "hap1"
sourmash_t: "hap2"
sourmash_estimator: "r_pc"

# --- svim-asm ---
svim_chunk_size: 200000000
svim_minimap_x: "asm10"
svim_samtools_sort_m: "1G"
svim_reference_gap_tolerance: 2000000
svim_max_sv_size: 25000000

# --- MSMC2 ---
msmc2_binary: "/global/scratch/users/milesroberts/conda/msmc2/bin/msmc2_Linux"
msmc2_generate_multihetsep: "/global/home/users/milesroberts/bin/msmc-tools/generate_multihetsep.py"
msmc2_p: "1*2+25*1+1*2+1*3"

# --- BRAKER3 RNA-seq annotation ---
minimap2_braker:
    backbone: "../resources/reference/hap1.fasta"
    variant: "../resources/reference/Phlox_drummondii.fasta"
    #variant: "../resources/reference/Linanthus_parryae.fasta"
rna_sra_accessions:
  - "SRR29348131"
  - "SRR29348132"
  - "SRR29348133"
  - "SRR29348134"
  - "SRR29348135"
braker_genomes:
  linanthus: "../resources/reference/Linanthus_parryae_spaceless.fasta"
braker_species: "linanthus_parryae"
braker_container: "docker://teambraker/braker3:v3.1.1"
braker_use_protein: true
braker_odb_url: "https://bioinf.uni-greifswald.de/bioinf/partitioned_odb12/Viridiplantae.fa.gz"
braker_odb_md5: "34c1f027a1a7b10f225b69fbd5500587"

# --- AnchorWave single scaffold pair alignment ---
anchorwave_pair:
  backbone:                                  # reference; donates the annotation
    fasta: "../resources/reference/hap1.fasta"
    gff: "../resources/annotation/hap1.gff3"
    scaffold: "scaffold_25"
  variant:                                   # query
    fasta: "../resources/reference/hap2.fasta"
    scaffold: "scaffold_2"              # name as it appears in the fasta
anchorwave_pair_common_name: "foobar"
anchorwave_minimap_k: 12
anchorwave_minimap_p: 0.4
anchorwave_minimap_n: 20

# --- dn/ds ---
#dnds_aa_fasta: "../config/dnds/OG0001281_myb_cluster_only_aa.fa"
dnds_aa_fasta: "OG0000820_aa.fa"
dnds_cds_fasta: "OG0000820_cds.fa"
#dnds_cds_fasta: "../config/dnds/OG0001281_myb_cluster_only_cds.fa"
dnds_yn00_ctl: "../config/dnds/yn00.ctl"

# --- freqk ---
freqk_binary: "/global/scratch/users/milesroberts/moi_lab_projects/freqk/target/release/freqk"
freqk_k: 31
freqk_min_qual: 30
# Toggle the grenedalf polymorphic-site exclusion in freqk_filter_vcf;
# false drops the exclusion BED (and its grenedalf CSV inputs) from the
# DAG entirely. Flip to true (or --config override) to re-enable.
freqk_use_exclusion_filter: false
# W-pool polymorphic-site exclusion thresholds (grenedalf frequency CSV columns)
freqk_min_alt_count: 1
freqk_min_depth: 10
freqk_min_polymorphic_freq: 0.02
freqk_max_polymorphic_freq: 0.98

# --- kMate ---
# Haplotype-mixture allele-frequency estimates for the kmate_groups
# pools. Panel is built from freqk's norm.vcf.gz with an all-reference
# backbone column (hap1) appended and hap2 haploidized; kMate consumes
# the same vg products (prefixed fasta, fastq reads) but keeps indels,
# which freqk's -v snps stage drops. --min-ac 1 is mandatory for the
# 2-founder panel (default 2 empties the k-mer matrix).
kmate_groups: ["P"]
kmate_k: 31
kmate_min_ac: 1
kmate_invariant_margin: 1
kmate_unit: "chrom"
# jellyfish hash size for build-kmer-db; pool 1 is 456 GB of fastq,
# size the hash generously (wiki default 3G is too small here)
kmate_hash_size: "32G"

# --- CDS windows ---
# One assembly fasta + one matching GFF3 annotation; output is a BED of
# fixed, non-overlapping windows across every scaffold with the number
# of (merged) CDS-annotated bases per window, zeros included. The
# window width is embedded in the output filename
# (results/cds_windows/cds_windows_w{wlen}.bed), so results for
# different sizes coexist; add sizes to the list to generate more.
cds_windows_fasta: "../resources/reference/hap1.fasta"
cds_windows_gff3: "results/featurecounts/hap1_expressed.gff3"
cds_windows_sizes: [50000, 100000, 500000]

# --- LDx ---
# Linkage disequilibrium (r^2) from pooled alignments (Feder, Petrov &
# Bergland 2012, PLoS ONE 7(11):e48588). One LDx run per pool and
# scaffold: the script parses only the POS column (col 2) of its SNP
# list and ignores CHROM, so each run pairs a single-scaffold SAM slice
# with a single-scaffold SNP-list slice. Options must precede the two
# positional inputs, and -h sets the maximum site read depth (repeat/
# paralog guard), not help. Site-depth thresholds are scaled per pool
# from the mean per-site depth of the grenedalf frequency table:
# -l = max(floor, mean/divisor), -h = multiple x mean (defaults
# reproduce the paper's 10..100 geometry at 40x mean depth). The
# binary is provisioned outside the repo (see AGENTS.md).
ldx_binary: "/global/home/users/milesroberts/bin/LDx.pl"
ldx_maf: 0.1
ldx_min_intersect: 11
ldx_searchlen: 500
ldx_baseq: 20
ldx_min_depth_floor: 10
ldx_min_depth_divisor: 8
ldx_max_depth_multiple: 2.0
ldx_min_mapq: 20
ldx_snplist_min_depth: 10

# --- VIGS target design ---
# Transcriptome fasta (all transcript records); record IDs listed in
# --- VIGS target design ---
# Transcriptome fasta (all transcript records); record IDs listed in
# vigs_target_transcripts are the VIGS targets. The targets' k-mers
# (size vigs_k) are counted with KMC and mapped back to the whole
# transcriptome with bwa mem; the workflow stops at the coordinate-
# sorted, indexed results/vigs/kmers_mapped.bam — deciding which
# k-mers are target-unique and assembling stretches is downstream
# analysis (docx: reject any target containing a >=19-21 nt contiguous
# match with a non-target transcript).
vigs_transcriptome_fasta: "../resources/annotation/LPJR3B1_scaf_hap1.codingseq"
vigs_target_transcripts: ["g166507.t1"]
vigs_k: 19

# --- BUSCO annotation completeness ---
# Protein-mode BUSCO over the BRAKER3 annotations (braker_genomes keys).
# busco_isoform selects the representative proteins: "t1" keeps TSEBRA's
# primary transcript per gene, "none" keeps every transcript. The
# lineage dataset (name embedded in output filenames) is fetched by
# busco_lineage_download into busco_downloads_dir on a login node
# (compute nodes have no internet). Note the BUSCO-canonical spelling
# carries a version suffix: "eudicotyledons_odb12.2".
busco_lineage: "eudicotyledons_odb12.2"
busco_isoform: "t1"
busco_downloads_dir: "results/busco/downloads"

# --- samples ---
samples_table: "../config/samples.tsv"
