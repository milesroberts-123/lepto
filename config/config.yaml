# --- KMC ---
kmc_k: 31
kmc_mincount: 10
kmc_maxcount: auto

# --- fastp ---
fastp_unqual_limit: 40
fastp_qual_thresh: 20
fastp_window_length: 4
fastp_min_len: 31
fastp_n_base_limit: 5

# --- kmc_filter: how to build group-specific k-mer set ---
subtract_groups: true
min_group_count: 0

# --- metaSPAdes ---
metaspades_kmers: "auto"
metaspades_mem: 200
metaspades_tmp_dir: "/tmp"

# --- kmc_tools complex params ---
kmc_intersect_depth: 1000000

# --- BWA ---
bwa_refs:
  hap1: "../resources/reference/LPJR3B2_scaffolds_final_hap1.fa"
  hap2: "../resources/reference/LPJR3B2_scaffolds_final_hap2.fa"
bwa_count_threshold: 40
bwa_k: 31
bwa_A: 1
bwa_B: 100
bwa_O: 100
bwa_E: 100
bwa_L: 100
bwa_T: 31
bwa_merge_distance: 1000

# --- minimap2 ---
minimap2_f: 0.02


# --- PANTHER HMM search ---
panther_input_fastas:
  hap1: "../resources/annotation/LPJR3B1_scaf_hap1_braker_aa.fasta"
  hap2: "../resources/annotation/LPJR3B1_scaf_hap2_braker_aa.fasta"
panther_batches: 3000
panther_hmmsearch_cpu: 8
panther_hmmsearch_evalue: 0.001
panther_hmmsearch_dome: 1e-8
panther_hmmsearch_ince: 0.001
panther_hmmsearch_incdome: 1e-8

# --- OrthoFinder ---
orthofinder_threads: 8
orthofinder_parallel: 8

# --- samples ---
samples_table: "../config/samples.tsv"
