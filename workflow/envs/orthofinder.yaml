name: orthofinder
channels:
  - bioconda
  - conda-forge
dependencies:
  - python=3.12
  - orthofinder=3.1.5
  - seqkit=2.13.0
  # orthofinder imports ete4 at startup and ete4's smartview submodule imports
  # brotli eagerly, but the bioconda closure leaves it unsatisfied
  # (ete4 4.4.0 declares Requires-Dist: brotli). Without this the rule dies
  # with ModuleNotFoundError before OrthoFinder prints anything.
  - brotli
