executor: slurm
jobs: 100000
cores: 100

default-resources:
  slurm_account: "co_moilab"
  #slurm_partition: "savio3_htc"
  #slurm_qos: "savio_lowprio"
  slurm_partition: "savio4_htc"
  slurm_qos: "moilab_htc4_normal"
  slurm_extra: "'--exclude=n0050.savio4,n4252.savio4,n4254.savio4,n0203.savio4'"
  mem_mb: 0
  mem_mb_per_cpu: 0
  disk_mb: 0
  cpus_per_task: 1
  mem_per_cpu: 0
  ntasks: 1
  threads: 1
  runtime: 60

set-threads:
  samtools_fastq: 4
  fastp: 8
  kmc_count: 8
  kmc_intersect_group: 4
  kmc_subtract: 4
  bwa_mem: 8
  panther_hmmsearch: 8
  orthofinder_run: 16
  featurecounts_run: 4
  minimap2_asm_paf: 16
  vg_autoindex: 2
  vg_giraffe: 12
  vg_surject: 8
  samtools_sort_vg: 8
  grenedalf_diversity_interval: 4
  grenedalf_diversity_genome: 4
  grenedalf_frequency: 4
  grenedalf_fst_interval: 8
  grenedalf_fst_genome: 8
  sourmash_sketch: 1
  msmc2_run: 4
  seqkit_sliding: 4
  minimap2_svim_asm: 16
  samtools_sort_svim: 2

set-resources:
  samtools_fastq:
    cpus_per_task: 4
    runtime: 240
  fastp:
    cpus_per_task: 8
    runtime: "max(2*input.size_mb/(1024*threads), 10)"
  kmc_count:
    cpus_per_task: 8
    runtime: 120
  kmc_intersect_group:
    cpus_per_task: 4
    runtime: 120
  kmc_subtract:
    cpus_per_task: 4
    runtime: 120
  bwa_mem:
    cpus_per_task: 8
    runtime: 120
  panther_hmmsearch:
    cpus_per_task: 8
    runtime: 20
  orthofinder_stage:
    runtime: 10
  orthofinder_stage_external:
    runtime: 10
  orthofinder_run:
    slurm_account: "co_moilab"
    slurm_partition: "savio4_htc"
    slurm_qos: "moilab_htc4_normal"
    cpus_per_task: 16
    runtime: 1440
  featurecounts_run:
    cpus_per_task: 4
    runtime: 60
  degenotate_run:
    cpus_per_task: 8
    runtime: 120
  minimap2_asm_paf:
    cpus_per_task: 16
    runtime: 120
  vg_autoindex:
    cpus_per_task: 32
    max_mem: "32G"
    runtime: 240
  vg_giraffe:
    cpus_per_task: 16
    runtime: "max(4*input.size_mb/1024, 20)"
  vg_surject:
    cpus_per_task: 8
    runtime: "max(4*input.size_mb/1024, 20)"
  samtools_sort_vg:
    cpus_per_task: 8
    runtime: 360
  picard_reorder_sam:
    runtime: 1440
  samtools_index_reordered:
    runtime: 360
  samtools_mpileup:
    runtime: 360
  grenedalf_diversity_interval:
    cpus_per_task: 4
    runtime: 1440
  grenedalf_diversity_genome:
    cpus_per_task: 4
    runtime: 1440
  grenedalf_frequency:
    cpus_per_task: 4
    runtime: 1440
  grenedalf_fst_genome:
    cpus_per_task: 8
    runtime: 1440
  grenedalf_fst_interval:
    cpus_per_task: 8
    runtime: 1440
  sourmash_sketch:
    cpus_per_task: 1
    runtime: 60
  msmc2_faidx:
    runtime: 60
  msmc2_contigs:
    runtime: 10
  msmc2_mask:
    runtime: 10
  msmc2_generate:
    cpus_per_task: 1
    runtime: 60
  msmc2_run:
    cpus_per_task: 4
    runtime: 1440
  seqkit_sliding:
    cpus_per_task: 4
    runtime: 60
  minimap2_svim_asm:
    cpus_per_task: 32
    runtime: 480
  samtools_sort_svim:
    cpus_per_task: 4
    runtime: 360
  samtools_index_svim:
    runtime: 60
  svim_asm_run:
    cpus_per_task: 1
    runtime: 1440
